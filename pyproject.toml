[project]
name = "imusa"
version = "0.1.0"
description = "IMUSA @ FIRE 2026 — Indic Meme Understanding & Sentiment Analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ananya Karn"},
]

dependencies = [
    # Core ML
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "datasets>=2.14",
    "accelerate>=0.25",
    
    # Vision
    "Pillow>=10.0",
    "opencv-python>=4.8",
    "albumentations>=1.3",
    
    # Text / NLP
    "sentencepiece>=0.1.99",
    "tokenizers>=0.15",
    "indic-nlp-library>=0.92",
    
    # OCR
    "paddleocr>=2.7",
    "paddlepaddle>=2.5",
    "easyocr>=1.7",
    
    # Experiment Tracking
    "wandb>=0.16",
    
    # Utilities
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipywidgets>=8.0",
    "black>=23.0",
    "ruff>=0.1",
]
vlm = [
    "google-generativeai>=0.5",
    "openai>=1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["src*"]
